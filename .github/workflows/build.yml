name: Build Arduino firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CORE: arduino:avr            # e.g. esp32:esp32, arduino:samd
  FQBN: arduino:avr:uno        # run arduino-cli board listall to find yours
  SKETCH_PATH: .               # folder containing your .ino (and .cpp/.h files)
  BUILD_DIR: build
  # For non-official cores (ESP32, etc.), set the board manager URL:
  # ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.CORE }}-${{ hashFiles('**/libraries.txt') }}

      - name: Install core
        run: |
          arduino-cli core update-index ${ADDITIONAL_URLS:+--additional-urls "$ADDITIONAL_URLS"}
          arduino-cli core install "$CORE" ${ADDITIONAL_URLS:+--additional-urls "$ADDITIONAL_URLS"}

      - name: Install libraries
        run: |
          # One library per line in libraries.txt, e.g. "ArduinoJson@7.0.4"
          if [ -f libraries.txt ]; then
            grep -v '^\s*#' libraries.txt | grep -v '^\s*$' | while read -r lib; do
              arduino-cli lib install "$lib"
            done
          fi

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --warnings all \
            --output-dir "$BUILD_DIR" \
            "$SKETCH_PATH"
          ls -la "$BUILD_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/*.hex
            ${{ env.BUILD_DIR }}/*.bin
            ${{ env.BUILD_DIR }}/*.elf
          if-no-files-found: error
          retention-days: 30

  release:
    # Runs only when you push a tag like v1.2.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}-${{ github.sha }}
          path: firmware

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/*
          generate_release_notes: true